spring:
  application:
    name: fundamentos01
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true # Corregido: Estaba mal indentado
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

# ============== CONFIGURACIÓN DE JWT ==============
# IMPORTANTE: Cambié 'jwt' por 'app.jwt' para que coincida con tu clase Java
app:
  jwt:
    secret: ${JWT_SECRET:mySecretKeyForJWT2024MustBeAtLeast256BitsLongForHS256Algorithm}
    # Usamos expiration-ms para que coincida con el nombre en tu clase JwtProperties
    expiration-ms: 1800000 
    refresh-expiration: 604800000
    issuer: fundamentos01-api
    header: Authorization
    prefix: "Bearer "