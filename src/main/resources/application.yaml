# ============== CONFIGURACIÓN DE JWT ==============
# IMPORTANTE: Cambié 'jwt' por 'app.jwt' para que coincida con tu clase Java
app:
  jwt:
    secret: ${JWT_SECRET:mySecretKeyForJWT2024MustBeAtLeast256BitsLongForHS256Algorithm}
    # Usamos expiration-ms para que coincida con el nombre en tu clase JwtProperties
    expiration-ms: 1800000 
    refresh-expiration: 604800000
    issuer: fundamentos01-api
    header: Authorization
    prefix: "Bearer "